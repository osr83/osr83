<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Alfi Boutique watermark">
  <title>Alfi Boutique - Watermark</title>
  <desc>Transparent watermark for product photos. Drop on top of any image at 30-40% opacity.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@300&display=swap');
      .ar-display { font-family: 'Aref Ruqaa', 'Amiri Quran', 'Amiri', serif; font-weight: 700; }
      .lt-wordmark { font-family: 'Cinzel', serif; font-weight: 300; letter-spacing: 0.5em; }
    ]]></style>
  </defs>

  <!-- Pure transparent — letters are semi-opaque white for "embossed on photo" feel -->
  <g opacity="0.78">
    <text x="300" y="380" text-anchor="middle"
          class="ar-display"
          font-size="380"
          fill="#FFFFFF"
          direction="rtl">ف</text>
    <text x="300" y="490" text-anchor="middle"
          class="lt-wordmark"
          font-size="22"
          fill="#FFFFFF">ALFI BOUTIQUE</text>
  </g>
</svg>
