<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Alfi Boutique icon">
  <title>Alfi Boutique - Icon</title>
  <desc>Simplified emblem for favicon, app icon, social media avatar.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Amiri:wght@400;700&display=swap');
      .mono-latin { font-family: 'Cormorant Garamond', 'Playfair Display', 'Times New Roman', serif; font-weight: 300; }
      .mono-arabic { font-family: 'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif; font-weight: 700; }
    ]]></style>

    <symbol id="leaf-i" viewBox="-12 -36 24 36" overflow="visible">
      <path d="M 0,0 C -6,-10 -10,-22 0,-34 C 10,-22 6,-10 0,0 Z"/>
    </symbol>
  </defs>

  <!-- Rounded square cream background (favicon-friendly) -->
  <rect width="512" height="512" rx="92" fill="#F6EDD9"/>

  <g transform="translate(256 256)">
    <!-- Slightly thicker rings — readable at small sizes -->
    <circle r="195" fill="none" stroke="#B8935A" stroke-width="2.4"
            stroke-dasharray="595 22" stroke-dashoffset="287"/>
    <circle r="203" fill="none" stroke="#B8935A" stroke-width="0.8" opacity="0.5"/>
    <circle cx="-9" cy="-195" r="2" fill="#B8935A"/>
    <circle cx="9"  cy="-195" r="2" fill="#B8935A"/>

    <!-- Compact foliage -->
    <g transform="translate(-115 60)" stroke-linecap="round">
      <path d="M 10,30 C 0,-10 -10,-80 -25,-180" stroke="#B8935A" stroke-width="1.2" fill="none"/>
      <path d="M -6,-50 C -22,-58 -42,-62 -58,-58" stroke="#B8935A" stroke-width="0.9" fill="none"/>
      <path d="M -14,-110 C -30,-118 -50,-120 -60,-114" stroke="#B8935A" stroke-width="0.9" fill="none"/>
      <path d="M 0,-90 C 12,-98 22,-100 28,-94" stroke="#B8935A" stroke-width="0.7" fill="none"/>

      <use href="#leaf-i" transform="translate(-58 -58) rotate(-115) scale(1.2)" fill="#B8935A"/>
      <use href="#leaf-i" transform="translate(-60 -114) rotate(-100) scale(1.0)" fill="#B8935A"/>
      <use href="#leaf-i" transform="translate(28 -94) rotate(55) scale(0.9)" fill="#B8935A"/>
      <use href="#leaf-i" transform="translate(-25 -180) rotate(-20) scale(0.8)" fill="#B8935A"/>
      <use href="#leaf-i" transform="translate(-48 -85) rotate(-125) scale(1.0)" fill="#E8B8AC" opacity="0.95"/>
      <use href="#leaf-i" transform="translate(20 -65) rotate(40) scale(0.75)" fill="#E8B8AC" opacity="0.9"/>

      <circle cx="-22" cy="-50" r="2.4" fill="#B8935A"/>
      <circle cx="-12" cy="-170" r="2" fill="#B8935A"/>
    </g>

    <!-- Monogram, slightly bolder for small-size legibility -->
    <text x="0" y="80" text-anchor="middle" class="mono-latin" font-size="320" fill="#8B6F3F" font-weight="400">A</text>
    <text x="22" y="62" text-anchor="middle" class="mono-arabic" font-size="270" fill="#B8935A" direction="rtl">ف</text>
  </g>
</svg>
