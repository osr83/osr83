<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Alfi Boutique - الفي بوتيك (dark)">
  <title>Alfi Boutique - Dark</title>
  <desc>Logo on a dark background — for night mode, packaging, gift cards.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Amiri:wght@400;700&display=swap');
      .mono-latin { font-family: 'Cormorant Garamond', 'Playfair Display', 'Times New Roman', serif; font-weight: 300; }
      .mono-arabic { font-family: 'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif; font-weight: 700; }
      .name-arabic { font-family: 'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif; font-weight: 400; }
      .name-latin { font-family: 'Cinzel', 'Trajan Pro', 'Cormorant Garamond', serif; font-weight: 500; letter-spacing: 0.42em; }
    ]]></style>

    <!-- Subtle gold gradient for richer feel on dark bg -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E2C37C"/>
      <stop offset="50%"  stop-color="#C9A461"/>
      <stop offset="100%" stop-color="#A07A3F"/>
    </linearGradient>

    <symbol id="leaf-d" viewBox="-12 -36 24 36" overflow="visible">
      <path d="M 0,0 C -6,-10 -10,-22 0,-34 C 10,-22 6,-10 0,0 Z"/>
    </symbol>

    <symbol id="diamond-d" viewBox="-8 -8 16 16" overflow="visible">
      <path d="M 0,-7 L 5,0 L 0,7 L -5,0 Z"/>
      <circle cx="0" cy="0" r="1.2" fill="#1A140A"/>
    </symbol>
  </defs>

  <!-- Deep ink background -->
  <rect width="800" height="1000" fill="#1A140A"/>

  <g fill="url(#gold-grad)" stroke="url(#gold-grad)">

    <!-- Emblem -->
    <g transform="translate(400 320)">
      <circle r="208" fill="none" stroke="#8B6F3F" stroke-width="0.6" opacity="0.55"/>
      <circle r="200" fill="none" stroke-width="1.6"
              stroke-dasharray="610 18" stroke-dashoffset="295"/>
      <circle cx="-8" cy="-200" r="1.6" stroke="none"/>
      <circle cx="8"  cy="-200" r="1.6" stroke="none"/>

      <g transform="translate(-130 80)" stroke-linecap="round">
        <path d="M 10,30 C 0,-10 -5,-60 -10,-110 C -15,-150 -20,-180 -25,-200" stroke-width="1" fill="none"/>
        <path d="M -2,-30 C -18,-38 -38,-44 -58,-40" stroke-width="0.7" fill="none"/>
        <path d="M -8,-80 C -26,-92 -50,-96 -70,-88" stroke-width="0.7" fill="none"/>
        <path d="M -14,-130 C -32,-138 -52,-140 -64,-132" stroke-width="0.7" fill="none"/>
        <path d="M -20,-170 C -32,-176 -42,-176 -48,-170" stroke-width="0.6" fill="none"/>
        <path d="M 4,-50 C 14,-58 22,-58 28,-52" stroke-width="0.6" fill="none"/>
        <path d="M -2,-100 C 10,-110 20,-112 28,-106" stroke-width="0.6" fill="none"/>

        <use href="#leaf-d" transform="translate(-58 -40) rotate(-115) scale(1.15)" stroke="none"/>
        <use href="#leaf-d" transform="translate(-70 -88) rotate(-105) scale(1.05)" stroke="none"/>
        <use href="#leaf-d" transform="translate(-64 -132) rotate(-100) scale(0.9)" stroke="none"/>
        <use href="#leaf-d" transform="translate(-48 -170) rotate(-80) scale(0.75)" stroke="none"/>
        <use href="#leaf-d" transform="translate(28 -52) rotate(60) scale(0.85)" stroke="none"/>
        <use href="#leaf-d" transform="translate(28 -106) rotate(50) scale(0.8)" stroke="none"/>
        <use href="#leaf-d" transform="translate(-25 -200) rotate(-25) scale(0.7)" stroke="none"/>
        <use href="#leaf-d" transform="translate(-50 -65) rotate(-130) scale(0.9)" stroke="none" fill="#E8B8AC" opacity="0.85"/>
        <use href="#leaf-d" transform="translate(-55 -110) rotate(-115) scale(0.85)" stroke="none" fill="#E8B8AC" opacity="0.8"/>
        <use href="#leaf-d" transform="translate(20 -80) rotate(45) scale(0.7)" stroke="none" fill="#E8B8AC" opacity="0.8"/>

        <circle cx="-30" cy="-30" r="2.2" stroke="none"/>
        <circle cx="-22" cy="-58" r="1.8" stroke="none"/>
        <circle cx="-12" cy="-188" r="1.6" stroke="none"/>
      </g>

      <text x="0" y="78" text-anchor="middle" class="mono-latin" font-size="320" stroke="none">A</text>
      <text x="22" y="60" text-anchor="middle" class="mono-arabic" font-size="260" stroke="none" direction="rtl">ف</text>
    </g>

    <!-- Wordmark -->
    <text x="400" y="680" text-anchor="middle" class="name-arabic" font-size="86" stroke="none" direction="rtl">الفي بوتيك</text>

    <g>
      <line x1="250" y1="730" x2="384" y2="730" stroke-width="0.6"/>
      <line x1="416" y1="730" x2="550" y2="730" stroke-width="0.6"/>
      <use href="#diamond-d" transform="translate(400 730) scale(0.85)" stroke="none"/>
    </g>

    <text x="400" y="800" text-anchor="middle" class="name-latin" font-size="50" stroke="none">ALFI BOUTIQUE</text>

    <g>
      <line x1="360" y1="858" x2="392" y2="858" stroke-width="0.5"/>
      <line x1="408" y1="858" x2="440" y2="858" stroke-width="0.5"/>
      <use href="#diamond-d" transform="translate(400 858) scale(0.5)" stroke="none"/>
    </g>
  </g>
</svg>
